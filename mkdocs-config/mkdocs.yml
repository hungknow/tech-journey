site_name: Tech Journey
site_description: Algorithms and Design Documentation
docs_dir: ..
site_dir: ../../site

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: indigo
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand

nav:
  - Home: index.md
  - Algorithms:
      - Array: algorithm/array.md
      - Binary Search: algorithm/binary-search.md
      - Dynamic Programming: algorithm/dynamic-programming.md
      - Graph: algorithm/graph.md
      - Greedy: algorithm/greedy.md
      - Hash Table: algorithm/hash-table.md
      - Backtracking: algorithm/backtracking.md
      - Math: algorithm/math.md
      - String: algorithm/string.md
      - Design: algorithm/design.md
      - SQL: algorithm/sql.md
  - SQL: design/sql/
  - Spacedrive: design/spacedrive/
  - Rust:
    - Arrow-Based CSV Data Processing: design/rust/rust_apache_arrow.md
    - Cython CSV Processing: design/rust/rust_csv_cython.md
    - Zero-cost Async: design/rust/rust_zero_cost_async.md
    - Zero Copy: design/rust/rust_zero_copy.md
  - Nautilus Trader:
