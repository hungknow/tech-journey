[package]
name = "tictactoe"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tictactoe"
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.27.0"

# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
features = ["abi3-py313"]