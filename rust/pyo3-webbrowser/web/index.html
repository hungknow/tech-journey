<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe with PyScript</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        
        <div class="game-container">
            <div class="game-status" id="gameStatus">Player X's turn</div>

            <table class="board">
                <tr>
                    <td><div id="cell00" data-x="0" data-y="0" class="cell"></div></td>
                    <td><div id="cell01" data-x="0" data-y="1" class="cell"></div></td>
                    <td><div id="cell02" data-x="0" data-y="2" class="cell"></div></td>
                <tr>
                    <td><div id="cell10" data-x="1" data-y="0" class="cell"></div></td>
                    <td><div id="cell11" data-x="1" data-y="1" class="cell"></div></td>
                    <td><div id="cell12" data-x="1" data-y="2" class="cell"></div></td>
                </tr>
                <tr>
                    <td><div id="cell20" data-x="2" data-y="0" class="cell"></div></td>
                    <td><div id="cell21" data-x="2" data-y="1" class="cell"></div></td>
                    <td><div id="cell22" data-x="2" data-y="2" class="cell"></div></td>
                </tr>
            </table>

            <h2 id="status"></h2>

            <button id="resetBtn" class="btn reset-btn">New Game</button>
        </div>

        <div class="editor-container">
            <h2>Live Code Editor</h2>
            <p>Edit the Python code below and click "Run" to control the game:</p>
            <div id="pyscript_editor"></div>
            <button id="runBtn" class="btn run-btn">Run Code</button>
        </div>

        <div id="terminal" hidden></div>
    </div>

    <!-- <script src="app.js"></script> -->
     <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
